<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Open Web Bridge 设置</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; font: 13px monospace; border: 1px solid #bbb; border-radius: 6px; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row input { flex: 1; }
  .row button { margin: 0; white-space: nowrap; }
  button { margin-top: 16px; padding: 8px 20px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; font: 13px system-ui; }
  button.secondary { background: #5f6368; }
  #msg { margin-top: 12px; color: #188038; min-height: 1.2em; }
  .hint { color: #666; font-size: 12px; margin-top: 4px; }
  .mode { margin: 12px 0; }
  .mode label { display: inline; font-weight: 400; margin-right: 18px; }
  .panel { border: 1px solid #e0e0e0; border-radius: 8px; padding: 4px 16px 8px; margin-top: 4px; }
  .panel.hidden { display: none; }
  code { background: #f1f3f4; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<h1>Open Web Bridge 设置</h1>
<p>选择连接模式，保存即重连。</p>

<div class="mode">
  <label><input type="radio" name="mode" value="local" checked> 本地模式（默认）</label>
  <label><input type="radio" name="mode" value="relay"> 中转模式（远程）</label>
</div>

<div id="localPanel" class="panel">
  <p class="hint">扩展直接连本机 daemon（<code>ws://127.0.0.1:18086/ws</code>）。一般无需改动。</p>
  <label for="wsUrl">daemon 地址（一般不用改）</label>
  <input id="wsUrl" type="text" placeholder="ws://127.0.0.1:18086/ws">
</div>

<div id="relayPanel" class="panel hidden">
  <p class="hint">扩展经公网中转连接远程 daemon（AI agent 机）。中转 URL 与 Token 需与 daemon 端一致；TLS 由中转内置。</p>
  <label for="relayUrl">中转 URL</label>
  <input id="relayUrl" type="text" placeholder="wss://owb-relay.你的子域.workers.dev">
  <label for="relayToken">中转 Token</label>
  <div class="row">
    <input id="relayToken" type="text" placeholder="与 daemon 端 OWB_RELAY_TOKEN 相同">
    <button id="gen" type="button" class="secondary">生成 Token</button>
  </div>
  <p class="hint">⚠️ Token 是远程访问你浏览器的唯一钥匙，生成后复制到 daemon 端环境变量 <code>OWB_RELAY_TOKEN</code>，勿泄露。</p>
</div>

<button id="save">保存并重连</button>
<div id="msg"></div>
<script src="options.js"></script>
</body>
</html>
