# 名字用 owb-relay2 而非 owb-relay：旧 worker 首次部署（无 sqlite migration）
# 可能在账号上留下了坏的 DO namespace 状态（已部署类无法事后改 SQLite 后端），
# 换名 = 全新 namespace，甩掉历史。旧 owb-relay 可在 CF Dashboard 手动删除。
name = "owb-relay2"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true   # 显式启用 *.workers.dev 路由（缺省时可能未开，表现为 1042/404）

# Durable Object 绑定：Worker 经 env.RELAY_ROOM 寻址 RelayRoom 实例
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

# 声明 DO 类（首次部署需要这条 migration；之后改类结构再加新 tag）。
# 用 new_sqlite_classes：Free 计划强制要求 SQLite 后端的 DO（即便本 DO 不用持久存储）。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# 默认 *.workers.dev 子域即用（自带 TLS）。
# 想用自定义域：CF Dashboard → Workers Routes 绑定自己的域名，TLS 自动签发。
